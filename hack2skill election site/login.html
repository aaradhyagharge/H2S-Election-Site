<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MATDAN — भारतीय निवडणूक शिक्षण व्यासपीठ</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .split-screen {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }
        .left-panel {
            background: radial-gradient(circle at center, rgba(255,153,51,0.1), var(--bg-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-right: 1px solid rgba(255,153,51,0.2);
        }
        .right-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
        }
        .auth-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .auth-toggle button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-family: var(--font-primary);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid transparent;
        }
        .auth-toggle button.active {
            color: var(--saffron);
            border-bottom-color: var(--saffron);
        }
        @media (max-width: 768px) {
            .split-screen { grid-template-columns: 1fr; }
            .left-panel { display: none; }
        }
    </style>
</head>
<body>
    <div class="split-screen">
        <div class="left-panel">
            <svg width="300" height="300" viewBox="0 0 200 200" style="animation: rotateSlow 30s linear infinite;">
                <circle cx="100" cy="100" r="90" stroke="#FF9933" stroke-width="2" fill="none"/>
                <circle cx="100" cy="100" r="15" fill="#FF9933"/>
                <g stroke="#FF9933" stroke-width="1">
                    <line x1="100" y1="10" x2="100" y2="190" />
                    <line x1="10" y1="100" x2="190" y2="100" />
                    <line x1="27" y1="27" x2="173" y2="173" />
                    <line x1="173" y1="27" x2="27" y2="173" />
                </g>
            </svg>
            <div style="position:absolute; bottom:2rem; text-align:center;">
                <h1 style="letter-spacing:5px;">MATDAN</h1>
                <p class="text-saffron">DEMOCRACY 2047</p>
            </div>
        </div>
        <div class="right-panel">
            <div class="auth-card hud-card reveal visible">
                <div class="auth-toggle">
                    <button id="show-login" class="active">LOGIN</button>
                    <button id="show-register">REGISTER</button>
                </div>

                <!-- Login Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-primary" style="width:100%; margin-top:1rem;">Access Portal</button>
                </form>

                <!-- Register Form (Hidden) -->
                <form id="register-form" class="hidden">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="full_name" required placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>State</label>
                        <select name="state">
                            <option value="Maharashtra">Maharashtra</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Karnataka">Karnataka</option>
                            <option value="Uttar Pradesh">Uttar Pradesh</option>
                            <!-- More states -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required placeholder="Create Password">
                    </div>
                    <button type="submit" class="btn-secondary" style="width:100%; margin-top:1rem;">Create Account</button>
                </form>

                <p id="auth-msg" class="text-center mt-2" style="font-size:0.9rem;"></p>
                <div class="text-center mt-3">
                    <a href="index.html" class="text-muted" style="font-size:0.8rem; text-decoration:none;">← Return to Main Page</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const showLogin = document.getElementById('show-login');
        const showRegister = document.getElementById('show-register');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const authMsg = document.getElementById('auth-msg');

        showLogin.onclick = () => {
            showLogin.classList.add('active');
            showRegister.classList.remove('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        };

        showRegister.onclick = () => {
            showRegister.classList.add('active');
            showLogin.classList.remove('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        };

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(loginForm));
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (json.token) {
                    localStorage.setItem('matdan_token', json.token);
                    localStorage.setItem('matdan_user_id', json.user.id);
                    authMsg.className = 'text-green text-center mt-2';
                    authMsg.textContent = 'Login successful! Redirecting...';
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    authMsg.className = 'text-deep-red text-center mt-2';
                    authMsg.textContent = json.error || 'Login failed';
                }
            } catch (err) {
                authMsg.textContent = 'Server error. Try again.';
            }
        };

        registerForm.onsubmit = async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(registerForm));
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (res.status === 201) {
                    authMsg.className = 'text-green text-center mt-2';
                    authMsg.textContent = 'Registration successful! Please login.';
                    showLogin.click();
                } else {
                    authMsg.className = 'text-deep-red text-center mt-2';
                    authMsg.textContent = json.error || 'Registration failed';
                }
            } catch (err) {
                authMsg.textContent = 'Server error. Try again.';
            }
        };
    </script>
</body>
</html>
